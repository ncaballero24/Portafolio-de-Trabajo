<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b55">
  <title>Sin conexión | Quántum ININDETEC</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; color: #f7fbff; background: radial-gradient(circle at 50% 15%, #123d8a 0, #071b55 28%, #030914 72%); }
    main { width: min(560px, 100%); padding: clamp(30px, 7vw, 54px); border: 1px solid rgba(82,128,255,.55); border-radius: 24px; background: rgba(3,9,20,.82); box-shadow: 0 30px 80px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.08); text-align: center; }
    img { width: min(220px, 70%); height: auto; margin-bottom: 24px; }
    span { color: #2edcff; font-size: .72rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(1.8rem, 7vw, 2.8rem); }
    p { margin: 0 auto 26px; color: #c7d5ef; line-height: 1.65; }
    button { min-height: 46px; padding: 11px 18px; color: #fff; border: 1px solid #5b8dff; border-radius: 12px; background: #245cff; cursor: pointer; font: inherit; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <img src="assets/quantum-logo-horizontal.png" alt="Quántum ININDETEC">
    <span>Modo sin conexión</span>
    <h1>Quántum sigue contigo</h1>
    <p>No pudimos conectarnos al servidor. Puedes regresar a las publicaciones que ya hayas visitado o intentar nuevamente cuando recuperes la conexión.</p>
    <button type="button" onclick="location.reload()">Intentar de nuevo</button>
  </main>
</body>
</html>
